[package]
name = "docsx-backend"
version = "0.5.5"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.6"
actix-files = "0.6.6"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
anyhow = "1.0"
thiserror = "1.0"
validator = { version = "0.16", features = ["derive"] }
deadpool-postgres = "0.10"
futures-util = "0.3.31"
tokio-postgres = { version = "0.7.13", features = ["with-uuid-1", "with-chrono-0_4"] }
url = "2.5.4"
dotenvy = "0.15"
jsonwebtoken = "9.3.1"
reqwest = { version = "0.11", features = ["json", "blocking"] }
jwks-client = "0.2.0"
base64 = "0.22.1"
lazy_static = "1.5.0"
futures = "0.3.31"
regex = "1.10.3"
actix-multipart = "0.6"
sanitize-filename = "0.5.0"
rand = "0.8.5"
md5 = "0.7"
