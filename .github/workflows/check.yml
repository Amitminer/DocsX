name: Lint Check

on:
  push:
    branches: [dev, beta]
  pull_request:
    branches: [dev, beta]

jobs:
  lint-backend:
    name: 🦀 Lint Rust (Clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docsx-backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

    lint-frontend:
    name: 💅 Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docsx-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm run lint
